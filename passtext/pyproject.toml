[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passtext"
version = "0.1.0"
description = "Unicode-safe password text processing reference implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"

testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
packages = ["passtext"]
